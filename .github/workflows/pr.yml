# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Pull Request
on: pull_request

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET, CycloneDX and Grype
        id: setup
        uses: ./.github/actions/setup-build
      - name: Build, test, pack and dogfood
        env:
          GRYPE_PATH: ${{ steps.setup.outputs.grype-path }}
        run: dotnet run --project build/Build.csproj -- --target All
      - name: Upload dogfood report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grype-dogfood-${{ matrix.os }}
          path: artifacts/dogfood/
          if-no-files-found: ignore
