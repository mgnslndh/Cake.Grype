# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release
on:
  push:
    tags: ['v*']

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Builds, tests, packs and dogfoods without any write permission or publishing credentials.
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install CycloneDX tool
        run: dotnet tool install -g CycloneDX --version 6.2.0
      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v7
        with:
          # Pinned: the action's default Grype (v0.110.0) cannot read CycloneDX 1.7 SBOMs written by CycloneDX tool 6.x.
          grype-version: v0.119.0
          cache-db: true
      - name: Build, test, pack and dogfood
        env:
          GRYPE_PATH: ${{ steps.grype.outputs.cmd }}
        run: dotnet run --project build/Build.csproj -- --target All
      - name: Upload dogfood report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-dogfood-release
          path: artifacts/dogfood/
          if-no-files-found: ignore
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: artifacts/*.nupkg
          if-no-files-found: error

  # Only this job can publish: it runs no tests or third-party build steps, just the Release target on the built package.
  publish:
    needs: build
    runs-on: windows-latest
    environment: Production
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts
      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish and create GitHub Release
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run --project build/Build.csproj -- --target Release
